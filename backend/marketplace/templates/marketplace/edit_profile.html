{% extends 'base.html' %}

{% block title %}Edit Profile | ReWear{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                <h3 class="fw-bold mb-3"><i class="bi bi-person-gear text-success"></i> Edit Profile Information</h3>
                <p class="text-muted small mb-4">Update your contact details, bio, and delivery address defaults.</p>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-rewear-primary rounded-pill px-4">Save Changes</button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
